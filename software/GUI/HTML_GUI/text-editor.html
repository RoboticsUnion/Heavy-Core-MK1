<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Robotics Union Software ©">
    <title>Robotics Union Control Software (based on HTML5)</title>
    
    <!-- Styling preset-->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="button-row">
        <a href="text-editor.html" class="main-options">Text-Editor</a>
        <a href="controls.html" class="main-options">Controls</a>
        <a href="settings.html" class="main-options">Settings</a>
        <a href="rsd.html" class="main-options">RSD</a>
        <a href="chamber.html" class="main-options">Chamber adjustments</a>
        <a href="Main_page.html" class="main-options">Main Page</a>
    </div>

    <h2 class="undertitle_text">G-Code Editor</h2>
    
   
    <textarea id="gcode-input" rows="20" style="width: 100%; font-family: 'Courier New', Courier, monospace; font-size: 14px; padding: 10px; box-sizing: border-box; resize: vertical; border: 2px solid #111111; border-radius: 5px;"></textarea>
    

    <button id="send-gcode" class="main-options" style="margin-top: 15px; width: auto; padding: 0 20px;">Send G-Code</button>

    
    <p id="response" class="normal_text" style="color: grey; margin-top: 5px;">Status: Not Connected</p>
    <p class="normal_text" style="color: grey; margin-top: 5px;">Note: Please code in DialogiXMove there is no check for correct writing.©</p>


   
    <script>
    let port;
    let writer;

   
    document.getElementById('send-gcode').addEventListener('click', async () => {
        const status = document.getElementById('response'); // ID angepasst an 'response'
        const gcodeText = document.getElementById('gcode-input').value;

        try {
            
            if (!port) {
                status.innerText = "Status: Warte auf Port-Auswahl...";
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); // Baudrate passend zum C++ Programm
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
            }

            status.innerText = "Status: Sende G-Code...";
            status.style.color = "orange";
            
            
            await writer.write(gcodeText + "\n"); 
            
            status.innerText = "Status: G-Code erfolgreich gesendet!";
            status.style.color = "green";

        } catch (error) {
            status.innerText = "Status Fehler: " + error.message;
            status.style.color = "red";
        }
    });
    </script>
    
</body>
</html>
